<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positive Streak Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Positive Streak Tracker</h1>
    <p>Keep track of your positive habits and build streaks of success!</p>
    <div id="streak-container">
      <p>Current Streak: <span id="streak-count">0</span> days</p>
      <button id="start-streak">Start New Streak</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
